<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Score Overlay</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;600;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            overflow: hidden;
        }

        .font-teko {
            font-family: 'Teko', sans-serif;
        }

        /* Smooth pulse for live action banner */
        @keyframes pulse-action {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .animate-action {
            animation: pulse-action 0.4s ease-in-out;
        }

        /* Glassmorphism styling for broadcast aesthetic */
        .glass-panel {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-top {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-end min-h-screen">

    <!-- OVERLAY CONTAINER -->
    <div class="w-full max-w-4xl flex flex-col items-center gap-1">

        <!-- 1. LIVE ACTION / EVENT BANNER (Top) -->
        <div id="actionBanner" class="hidden w-1/2 text-center py-1 px-4 rounded-t-lg font-teko text-3xl uppercase tracking-wider text-white font-bold shadow-lg transition-all duration-300">
            <span id="actionText">LIVE ACTION</span>
        </div>

        <!-- 2. MAIN SCOREBOARD PANEL -->
        <div class="w-full glass-panel rounded-xl shadow-2xl overflow-hidden flex flex-col md:flex-row items-center text-white border border-slate-700">
            
            <!-- BATTING TEAM SECTION -->
            <div class="flex items-center gap-3 p-3 bg-gradient-to-r from-emerald-900/80 to-slate-900 border-r border-slate-700/60 w-full md:w-1/3">
                <img id="battingFlag" src="https://flagcdn.com/w80/pk.png" alt="Pakistan Flag" class="w-12 h-8 rounded object-cover shadow border border-slate-500">
                <div class="flex flex-col">
                    <div class="flex items-baseline gap-2">
                        <span id="battingTeamCode" class="font-teko text-3xl font-bold tracking-wide text-emerald-400">PAK</span>
                        <span id="totalScore" class="font-teko text-4xl font-extrabold text-white leading-none">140-2</span>
                    </div>
                    <span id="oversOwed" class="text-xs text-slate-300 font-semibold">OVERS: <span id="oversValue" class="text-white">14.2</span></span>
                </div>
            </div>

            <!-- BATSMEN SECTION -->
            <div class="flex items-center justify-around p-2 w-full md:w-1/3 border-r border-slate-700/60 bg-slate-900/40">
                <!-- Striker -->
                <div id="strikerCard" class="flex items-center gap-2 p-1 rounded-lg bg-emerald-950/40 border border-emerald-500/30">
                    <img id="strikerImg" src="https://placehold.co/100x100/065f46/ffffff?text=Bat1" class="w-10 h-10 rounded-full border-2 border-emerald-400 object-cover">
                    <div class="text-left">
                        <div class="text-xs font-bold truncate max-w-[80px] text-emerald-300" id="strikerName">Babar A. *</div>
                        <div class="text-sm font-bold font-teko leading-none text-white"><span id="strikerRuns">28</span> <span class="text-xs text-slate-400 font-normal">(<span id="strikerBalls">19</span>)</span></div>
                    </div>
                </div>

                <!-- Non-Striker -->
                <div id="nonStrikerCard" class="flex items-center gap-2 p-1 rounded-lg opacity-80">
                    <img id="nonStrikerImg" src="https://placehold.co/100x100/1e293b/ffffff?text=Bat2" class="w-10 h-10 rounded-full border border-slate-500 object-cover">
                    <div class="text-left">
                        <div class="text-xs font-bold truncate max-w-[80px] text-slate-300" id="nonStrikerName">Rizwan</div>
                        <div class="text-sm font-bold font-teko leading-none text-white"><span id="nonStrikerRuns">18</span> <span class="text-xs text-slate-400 font-normal">(<span id="nonStrikerBalls">10</span>)</span></div>
                    </div>
                </div>
            </div>

            <!-- BOWLER & OPPONENT TEAM SECTION -->
            <div class="flex items-center justify-between p-3 w-full md:w-1/3 bg-gradient-to-l from-indigo-900/80 to-slate-900">
                <!-- Bowler Stats -->
                <div class="flex items-center gap-2">
                    <img id="bowlerImg" src="https://placehold.co/100x100/312e81/ffffff?text=Bowl" class="w-10 h-10 rounded-full border-2 border-indigo-400 object-cover">
                    <div>
                        <div class="text-xs font-bold text-indigo-300" id="bowlerName">Wood</div>
                        <div class="text-sm font-bold font-teko leading-none text-white"><span id="bowlerWickets">1</span>-<span id="bowlerRuns">28</span> <span class="text-xs text-slate-400 font-normal">(<span id="bowlerOvers">2.2</span>)</span></div>
                        <!-- Ball Progress -->
                        <div id="ballTracker" class="flex gap-1 mt-1">
                            <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                            <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                            <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                            <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                        </div>
                    </div>
                </div>

                <!-- Opponent Flag & Code -->
                <div class="flex items-center gap-2 border-l border-slate-700 pl-3">
                    <div class="text-right">
                        <span id="bowlingTeamCode" class="font-teko text-2xl font-bold text-indigo-400">ENG</span>
                    </div>
                    <img id="bowlingFlag" src="https://flagcdn.com/w80/gb-eng.png" alt="England Flag" class="w-10 h-7 rounded object-cover shadow border border-slate-500">
                </div>
            </div>

        </div>

        <!-- DEMO CONTROL PANEL (FOR TESTING OVERLAY) -->
        <div class="mt-4 p-3 bg-slate-900/90 rounded-lg border border-slate-700 flex flex-wrap gap-2 justify-center text-xs text-white">
            <span class="w-full text-center font-bold text-slate-400 mb-1">Interactive Controller (Demo Events)</span>
            <button onclick="triggerEvent('4', 'bg-blue-600', 'FOUR!')" class="px-2 py-1 bg-blue-600 rounded font-bold hover:bg-blue-500">Four (4)</button>
            <button onclick="triggerEvent('6', 'bg-purple-600', 'SIX!')" class="px-2 py-1 bg-purple-600 rounded font-bold hover:bg-purple-500">Six (6)</button>
            <button onclick="triggerEvent('W', 'bg-red-600', 'WICKET!')" class="px-2 py-1 bg-red-600 rounded font-bold hover:bg-red-500">Wicket</button>
            <button onclick="triggerEvent('WD', 'bg-amber-600', 'WIDE BALL')" class="px-2 py-1 bg-amber-600 rounded font-bold hover:bg-amber-500">Wide</button>
            <button onclick="triggerEvent('NB', 'bg-orange-600', 'NO BALL')" class="px-2 py-1 bg-orange-600 rounded font-bold hover:bg-orange-500">No Ball</button>
            <button onclick="switchTeams()" class="px-2 py-1 bg-emerald-600 rounded font-bold hover:bg-emerald-500">Switch Teams (IND vs AUS)</button>
        </div>

    </div>

    <script>
        /**
         * Function to trigger live action event banners dynamically
         * @param {string} type - Event code (4, 6, W, WD, NB)
         * @param {string} bgClass - Tailwind background color class
         * @param {string} label - Text to display in banner
         */
        function triggerEvent(type, bgClass, label) {
            const banner = document.getElementById('actionBanner');
            const text = document.getElementById('actionText');

            // Reset banner classes
            banner.className = `w-1/2 text-center py-1 px-4 rounded-t-lg font-teko text-3xl uppercase tracking-wider text-white font-bold shadow-lg transition-all duration-300 ${bgClass} animate-action block`;
            text.innerText = label;

            // Hide banner after 3 seconds automatically
            setTimeout(() => {
                banner.classList.add('hidden');
            }, 3000);
        }

        /**
         * Dynamic Team Switching Example (API Integration Placeholder)
         */
        let isDefaultTeam = true;
        function switchTeams() {
            if (isDefaultTeam) {
                // Switch to IND vs AUS
                document.getElementById('battingTeamCode').innerText = 'IND';
                document.getElementById('battingFlag').src = 'https://flagcdn.com/w80/in.png';
                document.getElementById('totalScore').innerText = '182-4';
                document.getElementById('oversValue').innerText = '18.4';

                document.getElementById('strikerName').innerText = 'V. Kohli *';
                document.getElementById('strikerRuns').innerText = '74';
                document.getElementById('strikerBalls').innerText = '48';

                document.getElementById('nonStrikerName').innerText = 'Hardik';
                document.getElementById('nonStrikerRuns').innerText = '22';
                document.getElementById('nonStrikerBalls').innerText = '11';

                document.getElementById('bowlingTeamCode').innerText = 'AUS';
                document.getElementById('bowlingFlag').src = 'https://flagcdn.com/w80/au.png';
                document.getElementById('bowlerName').innerText = 'Starc';
                document.getElementById('bowlerWickets').innerText = '2';
                document.getElementById('bowlerRuns').innerText = '35';
                document.getElementById('bowlerOvers').innerText = '3.4';
                
                isDefaultTeam = false;
            } else {
                // Switch back to PAK vs ENG
                document.getElementById('battingTeamCode').innerText = 'PAK';
                document.getElementById('battingFlag').src = 'https://flagcdn.com/w80/pk.png';
                document.getElementById('totalScore').innerText = '140-2';
                document.getElementById('oversValue').innerText = '14.2';

                document.getElementById('strikerName').innerText = 'Babar A. *';
                document.getElementById('strikerRuns').innerText = '28';
                document.getElementById('strikerBalls').innerText = '19';

                document.getElementById('nonStrikerName').innerText = 'Rizwan';
                document.getElementById('nonStrikerRuns').innerText = '18';
                document.getElementById('nonStrikerBalls').innerText = '10';

                document.getElementById('bowlingTeamCode').innerText = 'ENG';
                document.getElementById('bowlingFlag').src = 'https://flagcdn.com/w80/gb-eng.png';
                document.getElementById('bowlerName').innerText = 'Wood';
                document.getElementById('bowlerWickets').innerText = '1';
                document.getElementById('bowlerRuns').innerText = '28';
                document.getElementById('bowlerOvers').innerText = '2.2';

                isDefaultTeam = true;
            }
        }
    </script>
</body>
</html>
